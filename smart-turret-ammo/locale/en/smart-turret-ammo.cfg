[mod-name]
smart-turret-ammo=Smart Turret Ammo

[mod-description]
smart-turret-ammo=Gun, rocket, railgun and artillery turrets (and artillery wagons) keep themselves stocked with the best ammo in reach: construction robots bring it from the logistic network, and on space platforms the hub throws it across. Worse ammo is swapped out for better ammo automatically.

[mod-setting-name]
sta-keep=Ammo to keep in each turret
sta-refill-percent=Refill when below (% of the amount kept)
sta-upgrade=Swap worse ammo for better ammo
sta-pause-while-shooting=Pause requests while a turret is shooting
sta-skip-inserter-fed=Skip turrets fed by inserters
sta-turrets-per-tick=Turrets checked per tick
sta-use-modded-ammo=Use ammo from other mods
sta-blocked-ammo=Never use these ammo items

[mod-setting-description]
sta-keep=How much ammo a turret asks for when it's filled. Capped at one stack of that ammo (railgun ammo stacks smaller).
sta-refill-percent=A turret asks for a top-up when its ammo drops below this share of the amount kept.
sta-upgrade=When the network has a full load of better ammo (more damage: red over yellow, uranium over red, explosive over plain rockets; then higher quality), the old ammo is taken back to storage and the better ammo goes in.
sta-pause-while-shooting=Off: turrets keep asking for ammo in the middle of a fight. On: no requests while a turret has a target, so robots don't fly into combat.
sta-skip-inserter-fed=Leave alone any turret an inserter puts items into, so the mod doesn't fight your belts.
sta-turrets-per-tick=Turrets are checked in rotation, at most once a second each. Lower this if a huge base loses UPS.
sta-use-modded-ammo=On: ammo added by other mods is used too, ranked by how much damage it does. Ammo that spawns units, makes nuclear explosions or has a huge blast is never used. Off: only the base game's and Space Age's ammo.
sta-blocked-ammo=Internal item names, separated by commas, e.g. firearm-magazine, my-mod-poison-rounds. The mod will never request these.

[sta-gui]
title=Auto-load ammo
auto=Automatic: the best ammo in reach.
locked=Only this ammo is loaded. Anything else in the turret is taken back to storage.
pick-tooltip=Pick the ammo for this turret (only ammo it can fire). Shift + right-click / left-click copies it to other turrets, and blueprints remember it.
auto-button=Auto (best)
auto-tooltip=Go back to loading the best ammo in reach.
nothing=No ammo this turret can fire is allowed (check the "Never use" setting).
