[mod-name]
smart-turret-ammo=Smart Turret Ammo

[mod-description]
smart-turret-ammo=Gun, rocket, railgun and artillery turrets (and artillery wagons) keep themselves stocked with the best ammo in reach: construction robots bring it from the logistic network, and on space platforms the hub throws it across. Worse ammo is swapped out for better ammo automatically.

[mod-setting-name]
sta-keep=Ammo to keep in each turret
sta-refill-percent=Refill when below (% of the amount kept)
sta-upgrade=Swap worse ammo for better ammo
sta-pause-while-shooting=Pause requests while a turret is shooting
sta-skip-inserter-fed=Skip turrets fed by inserters
sta-use-personal-roboports=Use ammo carried by players and spidertrons
sta-turrets-per-tick=Turrets checked per tick
sta-use-modded-ammo=Use ammo from other mods
sta-blocked-ammo=Never use these ammo items

[mod-setting-description]
sta-keep=How much ammo a turret asks for when it's filled. Capped at one stack of that ammo (railgun ammo stacks smaller). When ammo is short, turrets share what there is: none of them asks for ammo another turret is already waiting for.
sta-refill-percent=A turret asks for a top-up when its ammo drops below this share of the amount kept. If none of that ammo is left, it swaps to another ammo that has a full load to spare (on planets, once it stops shooting).
sta-upgrade=When the network has a full load of better ammo that no other turret is waiting for (more damage: red over yellow, uranium over red, explosive over plain rockets; quality multiplies damage, so legendary yellow beats normal red), the old ammo is taken back to storage and the better ammo goes in. On planets this waits until the turret stops shooting.
sta-pause-while-shooting=Off: turrets keep asking for ammo in the middle of a fight. On: no requests while a turret has a target, so robots don't fly into combat. Space platforms ignore this: the hub throws the ammo, no robots fly.
sta-skip-inserter-fed=Leave alone any turret an inserter puts items into, so the mod doesn't fight your belts.
sta-use-personal-roboports=Off: only roboport networks count as a supply, so the mod never hands out the ammo in your inventory or a spidertron's trunk. On: personal roboports count too, and their robots load nearby turrets from what you carry. (Either way, the game may let your own robots help with a request when you stand close.)
sta-turrets-per-tick=Turrets are checked in rotation, at most once a second each. Lower this if a huge base loses UPS.
sta-use-modded-ammo=On: ammo added by other mods is used too, ranked by how much damage it does. Ammo that spawns units, makes nuclear explosions or has a huge blast is never used. Off: only the base game's and Space Age's ammo.
sta-blocked-ammo=Internal item names, separated by commas, e.g. firearm-magazine, my-mod-poison-rounds. The mod will never request these.

[sta-gui]
title=Auto-load ammo
auto=Automatic: the best ammo in reach.
locked=Only this ammo is loaded. Anything else in the turret is taken back to storage (once the turret stops shooting).
pick-tooltip=Pick the ammo for this turret (only ammo it can fire). Shift + right-click / left-click copies it to other turrets, and blueprints remember it.
auto-button=Auto (best)
auto-tooltip=Go back to loading the best ammo in reach.
nothing=No ammo this turret can fire is allowed (check the "Never use" setting).
blocked=The picked ammo (__1__) isn't allowed right now (the "Never use" or "Use ammo from other mods" setting, or another mod). This turret keeps the ammo it has; once that is used up, it gets the best allowed ammo in reach. The pick comes back once the ammo is allowed again.
